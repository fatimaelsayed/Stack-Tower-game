<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Tower</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Stack tower</h1>
    <p class="score">Score: <span id="scorenumber">0</span></p>
    <canvas id="canvas"></canvas>
    <div id="lose">
        <h2 id="text">Gameover! click to play again</h2>
        <p class="final">Score <span id="finalscore">0</span></p>
        <button id="again" onclick="restart()">Play again</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
